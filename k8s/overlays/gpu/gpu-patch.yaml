apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
spec:
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
          resources:
            requests:
              memory: 8Gi
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: 16Gi
              cpu: "4"
              nvidia.com/gpu: "1"
